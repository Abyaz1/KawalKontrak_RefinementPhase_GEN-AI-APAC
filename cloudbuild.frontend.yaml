steps:
  # 1. Build image Docker
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - '-t'
      - 'asia-southeast1-docker.pkg.dev/kawalkontrak-genaiapac/repo-kawalkontrak/frontend:latest'
      - '-f'
      - Dockerfile
      - .

  # 2. Deploy ke Cloud Run (otomatis mempertahankan env vars yang sudah ada)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - kawalkontrak-frontend
      - '--image'
      - 'asia-southeast1-docker.pkg.dev/kawalkontrak-genaiapac/repo-kawalkontrak/frontend:latest'
      - '--region'
      - asia-southeast1

images:
  - 'asia-southeast1-docker.pkg.dev/kawalkontrak-genaiapac/repo-kawalkontrak/frontend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
