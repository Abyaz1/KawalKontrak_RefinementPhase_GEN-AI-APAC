# KawalKontrak.ai — Continuous Integration
# Frontend: lint + type-check + build (tanpa kredensial — Firebase guarded)
# Backend : unit test pytest (golden-set live test otomatis skip tanpa API key)

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend_python/requirements-dev.txt

      - name: Run unit tests
        run: pytest backend_python/tests -v
