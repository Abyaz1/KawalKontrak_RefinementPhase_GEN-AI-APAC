# =============================================================
# KawalKontrak.ai — Development / demo satu perintah
#
#   1. Isi backend_python/.env dan .env.local (lihat *.example)
#   2. docker compose up --build
#   3. Buka http://localhost:3000
# =============================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - backend_python/.env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    env_file:
      - .env.local
    environment:
      # Di dalam network compose, backend dijangkau lewat nama service
      PYTHON_BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
